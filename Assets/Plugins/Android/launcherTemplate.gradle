apply plugin: 'com.android.application'
apply from: 'setupSymbols.gradle'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'

dependencies {
    implementation project(':unityLibrary')
    // Added 2026-07-25: required by the Google Cardboard XR Plugin's QrCodeCaptureActivity,
    // which declares android:theme="@style/Theme.AppCompat.NoActionBar" in its manifest.
    // Without this, the manifest merge fails with "resource style/Theme.AppCompat.NoActionBar not found".
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Added 2026-07-25: the Cardboard SDK's GfxPluginCardboard.aar (device-profile parsing,
    // used by the QR-scan feature) calls into com.google.protobuf.ExtensionRegistryLite at
    // runtime but does not bundle it or declare it as a Maven dependency. Without this, the app
    // builds fine but crashes on launch with "ClassNotFoundException: com.google.protobuf.ExtensionRegistryLite".
    implementation 'com.google.protobuf:protobuf-javalite:3.25.1'
    // Added 2026-07-25: Cardboard's QrCodeCaptureActivity (com.google.cardboard.sdk) uses the
    // legacy Google Mobile Vision barcode detector (com.google.android.gms.vision.barcode.BarcodeDetector)
    // to read the scanned QR profile, but does not declare it as a dependency. Without this, tapping
    // "scan QR code" crashes immediately with NoClassDefFoundError on BarcodeDetector$Builder.
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
}

android {
    namespace "**NAMESPACE**"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        applicationId '**APPLICATIONID**'
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**SIGN**

    lint {
        abortOnError false
    }

    buildTypes {
        debug {
            minifyEnabled **MINIFY_DEBUG**
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')**SIGNCONFIG**
        }
        release {
            minifyEnabled **MINIFY_RELEASE**
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')**SIGNCONFIG**
        }
    }**PACKAGING****PLAY_ASSET_PACKS****SPLITS**
**BUILT_APK_LOCATION**
    bundle {
        language {
            enableSplit false
        }
        density {
            enableSplit false
        }
        abi {
            enableSplit true
        }
        texture {
            enableSplit true
        }
    }

	**GOOGLE_PLAY_DEPENDENCIES**
}**SPLITS_VERSION_CODE****LAUNCHER_SOURCE_BUILD_SETUP**
